<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kairo is a curated calendar of music, food, talks, and community events. Find something worth leaving the house for."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f2e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11100d" />
    <meta property="og:title" content="Kairo — Plans worth making" />
    <meta
      property="og:description"
      content="A hand-picked calendar of events in the city. Browse, filter, and save your spot in minutes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/neon-fields.jpg" />
    <title>Kairo — Plans worth making</title>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('kairo.theme')
          const dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch {
          /* Preferences are optional. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
